<body>
<aside class="sidebar"><div class="brand"><div class="brand-mark" data-icon="layers"></div><div><strong>科研成果管理</strong><small>技术中心 · RESEARCH</small></div></div><div class="nav-label">工作空间</div><button class="nav active" data-view="overview"><span data-icon="grid"></span>工作概览</button><button class="nav" data-view="ledger"><span data-icon="folder"></span>成果台账</button><button class="nav" data-view="review"><span data-icon="check"></span>审核管理<span class="count" id="pending-count"></span></button><div class="sidebar-bottom"><strong>简化版演示</strong>所有记录均为虚构示例。<br>可体验填报、审核和查询。<br><button id="reset">恢复示例数据</button></div></aside>
<div class="shell"><header class="topbar"><div class="breadcrumb">技术中心 <span>/ <b id="crumb" style="font-weight:400">工作概览</b></span></div><div class="identity"><span class="demo-label">演示模式</span><span class="avatar">管</span><span class="user-name">管理员体验</span></div></header><main id="main"></main></div>
<div id="modal-root"></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const iconPaths={layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',check:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 12 3 3 5-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',export:'<path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',award:'<circle cx="12" cy="9" r="6"/><path d="m8 14-2 7 6-3 6 3-2-7"/>',trend:'<path d="m3 17 6-6 4 3 8-10M15 4h6v6"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${iconPaths[n]||iconPaths.folder}</svg>`;
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));
const types=['专利','软件著作权','论文与标准','技术创新','QC成果','成果转化'];
const departments=['技术研发部','生产管理部','质量管理部','设备管理部'];
const states={approved:'已入库',pending:'待审核',returned:'已退回',draft:'草稿'};
const SEED=[
{id:8,title:'生产质量追溯信息平台',type:'软件著作权',person:'陈明',department:'质量管理部',date:'2026-10-26',status:'pending',description:'汇集生产过程质量记录，支持按批次查询和异常追溯，减少人工查找台账的时间。',innovation:'将批次信息与过程质量记录关联，统一查询入口。',reward:0,benefit:0,application:'拟在质量管理部试用',files:['软件说明书.pdf']},
{id:7,title:'设备点检流程优化与移动记录',type:'技术创新',person:'李文',department:'设备管理部',date:'2026-10-23',status:'pending',description:'将设备日常点检记录电子化，集中记录异常和处理情况，便于后续跟踪。',innovation:'点检项目标准化，异常处理记录与点检记录关联。',reward:0,benefit:0,application:'设备管理部小范围验证',files:['点检流程优化方案.pdf']},
{id:6,title:'一种生产线物料均匀输送装置',type:'专利',person:'张华',department:'技术研发部',date:'2026-10-18',status:'approved',description:'针对输送过程中物料分布不均的问题，对输送结构进行改进，改善运行稳定性。',innovation:'优化导料结构，便于安装维护。',reward:1.5,benefit:12,application:'已在示例生产线应用',files:['专利证书.pdf']},
{id:5,title:'降低包装工序材料损耗',type:'QC成果',person:'王宁',department:'生产管理部',date:'2026-10-15',status:'approved',description:'通过分析包装工序损耗原因，优化参数设置与操作方法，形成标准作业要求。',innovation:'将关键参数调整与过程检查相结合。',reward:0.8,benefit:8.6,application:'生产管理部推广应用',files:['QC成果报告.pdf']},
{id:4,title:'关键工序质量控制技术规范',type:'论文与标准',person:'刘敏',department:'质量管理部',date:'2026-10-10',status:'approved',description:'梳理关键工序质量控制要求，统一检查指标、记录方式和异常处理流程。',innovation:'形成便于现场执行的检查清单。',reward:0.5,benefit:0,application:'作为内部技术规范使用',files:['技术规范.pdf']},
{id:3,title:'余热回收节能方案推广',type:'成果转化',person:'赵磊',department:'设备管理部',date:'2026-10-08',status:'approved',description:'对既有节能方案开展应用验证，登记实施效果并持续跟踪运行情况。',innovation:'利用现有设备条件进行改造。',reward:1,benefit:18,application:'已完成示例应用验证',files:['应用效果报告.pdf']},
{id:2,title:'生产过程参数分析工具',type:'软件著作权',person:'陈明',department:'技术研发部',date:'2026-10-06',status:'returned',description:'对过程记录进行整理和统计，为参数调整提供数据参考。',innovation:'支持数据批量导入与可视化统计。',reward:0,benefit:0,application:'待补充试用记录',files:[],reason:'请补充软件说明书及实际使用情况。'},
{id:1,title:'工艺参数稳定性提升方案',type:'技术创新',person:'李文',department:'技术研发部',date:'2026-10-02',status:'draft',description:'梳理影响工艺参数稳定性的因素，开展改进验证。',innovation:'',reward:0,benefit:0,application:'',files:[]}
];
const KEY='research-demo-v1';let records;try{const saved=JSON.parse(localStorage.getItem(KEY));records=Array.isArray(saved)?saved:structuredClone(SEED)}catch{records=structuredClone(SEED)}
let view='overview',filters={q:'',type:'',department:'',status:''},toastTimer,lastFocus;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const money=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2});
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch{toast('浏览器无法保存，当前改动在刷新后可能丢失');return false}}
function toast(s){clearTimeout(toastTimer);const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;toastTimer=setTimeout(()=>t.hidden=true,3200)}
function badge(r){return `<span class="status ${esc(r.status)}">${states[r.status]||'未知'}</span>`}
function options(values,current,placeholder){return `<option value="">${placeholder}</option>`+values.map(x=>`<option value="${esc(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('')}
function filtered(){return records.filter(r=>(view!=='review'||r.status==='pending')&&(!filters.q||[r.title,r.person,r.id].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.type||r.type===filters.type)&&(!filters.department||r.department===filters.department)&&(!filters.status||r.status===filters.status))}
function render(){document.querySelector('#pending-count').textContent=records.filter(r=>r.status==='pending').length;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const names={overview:'工作概览',ledger:'成果台账',review:'审核管理'};document.querySelector('#crumb').textContent=names[view];const approved=records.filter(r=>r.status==='approved');
document.querySelector('#main').innerHTML=`<div class="page-head"><div><h1>${names[view]}</h1><p class="sub">${view==='overview'?'从成果填报到审核入库，集中管理每一项创新。':view==='ledger'?'查询成果记录，查看进度与应用情况。':'查看待审核成果，通过后自动进入成果库。'}</p></div><button class="btn primary" id="add">${icon('plus')}新增成果</button></div>${view==='overview'?`<section class="stats"><div class="stat"><div class="stat-top">成果记录${icon('folder')}</div><div class="stat-value">${records.length}<small>项</small></div><div class="stat-note">包含草稿与审核中的记录</div></div><div class="stat"><div class="stat-top">待审核${icon('clock')}</div><div class="stat-value">${records.filter(r=>r.status==='pending').length}<small>项</small></div><button class="link" data-go="review">去处理待办 →</button></div><div class="stat"><div class="stat-top">已入库成果${icon('award')}</div><div class="stat-value">${approved.length}<small>项</small></div><div class="stat-note">已通过管理员审核</div></div><div class="stat"><div class="stat-top">登记效益${icon('trend')}</div><div class="stat-value">${money(approved.reduce((a,r)=>a+Number(r.benefit||0),0))}<small>万元</small></div><div class="stat-note">已入库成果填报的效益合计</div></div></section><section class="overview-row"><div class="panel"><div class="panel-head"><h2>成果类型分布</h2><small>全部 ${records.length} 项记录</small></div><div class="distribution">${types.map(t=>{const n=records.filter(r=>r.type===t).length;return `<div><div class="bar-label">${t}<b>${n} 项</b></div><div class="track"><span style="width:${records.length?n/records.length*100:0}%"></span></div></div>`}).join('')}</div></div><div class="panel"><div class="panel-head"><h2>简单三步，完成归档</h2><small>固定审核流程</small></div><div class="workflow"><div class="step"><i>1</i>成果填报</div><span class="arrow">→</span><div class="step"><i>2</i>管理员审核</div><span class="arrow">→</span><div class="step"><i>3</i>成果入库</div></div><p class="flow-note">资料不完整时可退回，补充后再次提交。</p></div></section>`:''}${view==='review'?'<div class="review-info">当前展示待审核记录。点击“审核”查看资料，并选择通过或退回。</div>':''}<section class="panel"><div class="panel-head"><h2>${view==='overview'?'最近成果':view==='review'?'待审核成果':'全部成果'}</h2><button class="btn small" id="export">${icon('export')}导出当前列表</button></div><div class="toolbar"><label class="search">${icon('search')}<input id="search" aria-label="搜索成果名称或完成人" placeholder="搜索成果名称、完成人…" value="${esc(filters.q)}"></label><select id="type-filter" aria-label="成果类型">${options(types,filters.type,'全部类型')}</select><select id="department-filter" aria-label="部门">${options(departments,filters.department,'全部部门')}</select>${view!=='review'?`<select id="status-filter" aria-label="成果状态"><option value="">全部状态</option>${Object.entries(states).map(([k,v])=>`<option value="${k}" ${filters.status===k?'selected':''}>${v}</option>`).join('')}</select>`:''}</div><div class="table-wrap"><table><thead><tr><th>成果名称</th><th>成果类型</th><th>完成人 / 部门</th><th>完成日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="table-foot"><span id="result-count"></span><span class="page-number">1</span></div></section><p class="notice">演示数据 · 仅保存在当前浏览器，不代表真实科研成果</p>`;
renderRows();document.querySelector('#add').onclick=()=>openForm();document.querySelector('#export').onclick=exportRows;document.querySelector('#search').oninput=e=>{filters.q=e.target.value;renderRows()};for(const [id,k] of [['type-filter','type'],['department-filter','department'],['status-filter','status']]){const e=document.getElementById(id);if(e)e.onchange=()=>{filters[k]=e.value;renderRows()}}document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>navigate(e.dataset.go))}
function renderRows(){const list=filtered();document.querySelector('#rows').innerHTML=list.length?list.map(r=>`<tr><td><button class="title-button" data-detail="${r.id}">${esc(r.title)}</button><div class="record-id">CG-${String(r.id).padStart(4,'0')}</div></td><td><span class="type">${esc(r.type)}</span></td><td>${esc(r.person)}<div class="record-id">${esc(r.department)}</div></td><td>${esc(r.date)}</td><td>${badge(r)}</td><td><button class="link" data-detail="${r.id}">${view==='review'?'审核':'查看详情'}</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty"><strong>暂无符合条件的成果</strong>可以调整筛选条件，或新增一项成果。</td></tr>';document.querySelector('#result-count').textContent=`共 ${list.length} 项记录`;document.querySelectorAll('[data-detail]').forEach(e=>e.onclick=()=>openDetail(Number(e.dataset.detail)))}
function navigate(v){view=v;filters={q:'',type:'',department:'',status:''};render()}
document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>navigate(e.dataset.view));
function modal(title,body,footer){lastFocus=document.activeElement;document.querySelector('#modal-root').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="close" aria-label="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></section></div>`;document.querySelector('.close').onclick=closeModal;document.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeModal()};document.querySelector('.close').focus()}
function closeModal(){document.querySelector('#modal-root').innerHTML='';if(lastFocus?.isConnected)lastFocus.focus()}
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const a=[...m.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled);const first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function openForm(id){const r=records.find(x=>x.id===id)||{title:'',type:'专利',person:'',department:'技术研发部',date:stamp(),description:'',innovation:'',application:'',reward:0,benefit:0,files:[]};modal(id?'编辑成果':'新增成果',`<form id="achievement-form" class="form-grid"><label class="field full">成果名称 <em>*</em><input name="title" maxlength="80" required placeholder="请输入成果名称" value="${esc(r.title)}"></label><label class="field">成果类型<select name="type">${types.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">完成部门<select name="department">${departments.map(t=>`<option ${r.department===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">完成人 <em>*</em><input name="person" maxlength="40" required placeholder="多人可用顿号分隔" value="${esc(r.person)}"></label><label class="field">完成日期 <em>*</em><input name="date" type="date" required value="${esc(r.date)}"></label><label class="field full">成果简介 <em>*</em><textarea name="description" rows="3" maxlength="2000" required placeholder="简要介绍解决的问题和取得的成果">${esc(r.description)}</textarea></label><label class="field full">主要创新点<textarea name="innovation" rows="2" maxlength="2000" placeholder="可选填">${esc(r.innovation)}</textarea></label><label class="field">奖励金额（万元）<input name="reward" type="number" min="0" step="0.01" value="${r.reward||0}"></label><label class="field">登记效益（万元）<input name="benefit" type="number" min="0" step="0.01" value="${r.benefit||0}"></label><label class="field full">应用情况<input name="application" maxlength="300" placeholder="如：已在哪个部门或生产环节应用" value="${esc(r.application)}"></label><label class="field full">佐证材料<input name="files" type="file" multiple><span class="hint">演示仅记录文件名称，不上传或保存文件内容。${r.files.length?' 已记录：'+r.files.map(esc).join('、'):''}</span></label></form>`,`<button class="btn" id="cancel-form">取消</button><button class="btn" id="draft-save">保存草稿</button><button class="btn primary" id="submit-form">提交审核</button>`);document.querySelector('#cancel-form').onclick=closeModal;document.querySelector('#draft-save').onclick=()=>submitForm(id,'draft');document.querySelector('#submit-form').onclick=()=>submitForm(id,'pending');document.querySelector('#achievement-form').onsubmit=e=>{e.preventDefault();submitForm(id,'pending')}}
function submitForm(id,status){const f=document.querySelector('#achievement-form');if(!f.reportValidity())return;const d=new FormData(f);if(!String(d.get('title')).trim()||!String(d.get('person')).trim()||!String(d.get('description')).trim()){toast('请填写成果名称、完成人和成果简介');return}const old=records.find(r=>r.id===id);const files=[...f.elements.files.files].map(x=>x.name);const r={id:id||Math.max(0,...records.map(x=>x.id))+1,title:d.get('title').trim(),type:d.get('type'),department:d.get('department'),person:d.get('person').trim(),date:d.get('date'),description:d.get('description').trim(),innovation:d.get('innovation').trim(),application:d.get('application').trim(),reward:Number(d.get('reward')),benefit:Number(d.get('benefit')),status,files:files.length?files:(old?.files||[]),history:[...(old?.history||[]),{date:stamp(),text:status==='pending'?'提交审核':'保存草稿'}]};if(old)records=records.map(x=>x.id===id?r:x);else records.unshift(r);const ok=save();closeModal();render();if(ok)toast(status==='pending'?'已提交，可前往“审核管理”体验审核':'草稿已保存，可在成果台账中继续编辑')}
function openDetail(id){const r=records.find(x=>x.id===id);if(!r)return;modal('成果详情',`<h3 class="detail-title">${esc(r.title)}</h3>${badge(r)} <span class="type" style="margin-left:14px">${esc(r.type)}</span><div class="detail-grid">${[['完成人',r.person],['完成部门',r.department],['完成日期',r.date],['成果编号','CG-'+String(r.id).padStart(4,'0')],['奖励金额',money(r.reward)+' 万元'],['登记效益',money(r.benefit)+' 万元']].map(([k,v])=>`<div><small>${k}</small>${esc(v)}</div>`).join('')}</div>${[['成果简介',r.description],['主要创新点',r.innovation||'未填写'],['应用情况',r.application||'未填写'],['佐证材料',r.files.length?r.files.join('\n')+'\n（演示文件名，不提供文件下载）':'未添加材料']].map(([k,v])=>`<div class="detail-section"><h3>${k}</h3><p>${esc(v)}</p></div>`).join('')}${r.reason?`<div class="detail-section"><h3>退回原因</h3><p>${esc(r.reason)}</p></div>`:''}<div class="detail-section"><h3>处理记录</h3><div class="history">${(r.history||[{date:r.date,text:'示例记录 · '+states[r.status]}]).map(h=>`<p>${esc(h.text)}<small>${esc(h.date)}</small></p>`).join('')}</div></div>${r.status==='pending'?'<div class="detail-section"><label class="field">审核意见（退回时必填）<textarea id="review-note" rows="2" maxlength="500" placeholder="填写审核意见或需要补充的内容"></textarea></label></div>':''}`,`<button class="btn" id="detail-close">关闭</button>${['draft','returned'].includes(r.status)?'<button class="btn primary" id="edit-record">编辑并提交</button>':''}${r.status==='pending'?'<button class="btn danger" id="reject-record">退回补充</button><button class="btn primary" id="approve-record">通过并入库</button>':''}`);document.querySelector('#detail-close').onclick=closeModal;if(document.querySelector('#edit-record'))document.querySelector('#edit-record').onclick=()=>openForm(id);if(r.status==='pending'){document.querySelector('#reject-record').onclick=()=>review(id,false);document.querySelector('#approve-record').onclick=()=>review(id,true)}}
function review(id,approved){const r=records.find(x=>x.id===id),note=document.querySelector('#review-note').value.trim();if(!approved&&!note){toast('请填写退回原因，便于补充材料');document.querySelector('#review-note').focus();return}r.status=approved?'approved':'returned';r.reason=approved?'':note;r.history=[...(r.history||[{date:r.date,text:'提交审核'}]),{date:stamp(),text:approved?'管理员审核通过，成果已入库'+(note?'：'+note:''):'管理员退回：'+note}];const ok=save();closeModal();render();if(ok)toast(approved?'审核通过，成果已入库':'已退回，可在成果台账中编辑并重新提交')}
function exportRows(){const rows=[['成果名称','成果类型','完成人','部门','完成日期','状态','奖励金额（万元）','登记效益（万元）'],...filtered().map(r=>[r.title,r.type,r.person,r.department,r.date,states[r.status],r.reward,r.benefit])];const text='\uFEFF'+rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='成果台账_演示.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出CSV表格，可用Excel打开')}
document.querySelector('#reset').onclick=()=>{modal('恢复示例数据','<p>将清除你在此演示中新增或修改的记录，恢复最初的8项示例成果。</p>','<button class="btn" id="cancel-reset">取消</button><button class="btn primary" id="confirm-reset">恢复示例</button>');document.querySelector('#cancel-reset').onclick=closeModal;document.querySelector('#confirm-reset').onclick=()=>{records=structuredClone(SEED);const ok=save();closeModal();navigate('overview');if(ok)toast('已恢复8项示例成果')}};
render();
</script>
</body></html>
